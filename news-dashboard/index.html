<style>
  .nw { font-family: var(--font-anthropic-sans); color: var(--color-fg); }
  .nw-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--cds-gap-sm); margin-bottom: var(--cds-gap-md); }
  .nw-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; }
  .nw-sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-body); margin: var(--cds-gap-xs) 0 0; }
  .nw-sub b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .nw-tabs { display: flex; gap: var(--cds-gap-xs); border-bottom: 1px solid var(--color-border-line); margin-bottom: var(--cds-gap-md); }
  .nw-tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: var(--cds-pad-sm) var(--cds-pad-md); font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg-muted); cursor: pointer; margin-bottom: -1px; }
  .nw-tab[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--color-fg); font-weight: 500; }
  .nw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: var(--cds-gap-md); }
  .nw-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-height: 18rem; display: flex; flex-direction: column; }
  .nw-card-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--cds-gap-sm); margin-bottom: var(--cds-gap-sm); }
  .nw-card-h h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
  .nw-card-h a { color: inherit; text-decoration: none; }
  .nw-card-h a:hover { text-decoration: underline; }
  .nw-meta { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nw-list { list-style: none; margin: 0; padding: 0; flex: 1; }
  .nw-list li { display: grid; grid-template-columns: 3.2rem 1fr; gap: var(--cds-gap-sm); padding: var(--cds-pad-xs) 0; border-top: 1px solid var(--color-border-line); font-size: var(--cds-font-size-body); line-height: 1.45; }
  .nw-list li:first-child { border-top: 0; }
  .nw-time { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; padding-top: 0.15em; }
  .nw a.nw-link { color: var(--color-fg); text-decoration: none; }
  .nw a.nw-link:hover { text-decoration: underline; }
  .nw-fresh { color: var(--color-ok); }
  .nw-tag { display: inline-block; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin-right: var(--cds-gap-xs); }
  .nw-bar { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; margin-bottom: var(--cds-gap-md); }
  .nw-chip { appearance: none; font: inherit; font-size: var(--cds-font-size-caption); border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg); border-radius: 999px; padding: var(--cds-pad-xs) var(--cds-pad-sm); cursor: pointer; }
  .nw-chip[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); border-color: var(--color-fg); }
  .nw-search { flex: 1 1 12rem; min-width: 0; font: inherit; font-size: var(--cds-font-size-body); padding: var(--cds-pad-xs) var(--cds-pad-sm); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); color: var(--color-fg); }
  .nw-tablebox { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); max-height: 70vh; overflow: auto; min-height: 18rem; }
  .nw-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-body); }
  .nw-table th { position: sticky; top: 0; background: var(--color-panel); text-align: left; font-weight: 500; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); padding: var(--cds-pad-sm) var(--cds-pad-md); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
  .nw-table td { padding: var(--cds-pad-xs) var(--cds-pad-md); border-top: 1px solid var(--color-border-line); vertical-align: top; line-height: 1.45; }
  .nw-table td.nw-c-time { white-space: nowrap; color: var(--color-fg-muted); font-variant-numeric: tabular-nums; font-size: var(--cds-font-size-caption); }
  .nw-table td.nw-c-src, .nw-table td.nw-c-cat { white-space: nowrap; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .nw-empty { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); padding: var(--cds-pad-md); }
  .nw-fail { display: flex; align-items: center; justify-content: center; gap: var(--cds-gap-xs); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); flex: 1; min-height: 8rem; }
  .nw-fail::before { content: ""; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--color-bad); }
  .nw-foot { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin-top: var(--cds-gap-md); }
  [data-dash-source-state=empty] { color: transparent; }
  [data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
  .nw-chart { position: relative; min-height: 260px; }
  .nw-chart svg { display: block; overflow: visible; }
  .nw-legend { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm) var(--cds-gap-md); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: var(--cds-gap-sm) 0 0; }
  .nw-legend span::before { content: ""; display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 2px; margin-right: 0.35rem; background: var(--sw); vertical-align: -0.05rem; }
  .nw-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; z-index: 2; }
  .nw-tip .h { color: var(--cds-text-secondary); margin-bottom: 2px; }
  .nw-tip i { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 2px; margin-right: 0.35rem; }
  .nw-tip b { font-weight: 500; font-variant-numeric: tabular-nums; margin-left: 0.5rem; float: right; }
  .nw-hours { display: flex; flex-direction: column; gap: var(--cds-gap-sm); margin-top: var(--cds-gap-md); }
  .nw-hour { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); }
  .nw-hour summary { cursor: pointer; padding: var(--cds-pad-sm) var(--cds-pad-lg); display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--cds-gap-xs) var(--cds-gap-md); list-style-position: inside; }
  .nw-hour summary .t { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-heading); font-variant-numeric: tabular-nums; }
  .nw-hour summary .n { font-weight: 500; font-variant-numeric: tabular-nums; }
  .nw-hour summary .bd { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .nw-hour-body { padding: 0 var(--cds-pad-lg) var(--cds-pad-md); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-sm) var(--cds-gap-lg); }
  .nw-hour-body h3 { font-size: var(--cds-font-size-caption); font-weight: 500; color: var(--color-fg-muted); margin: var(--cds-gap-sm) 0 0; }
  @media (prefers-reduced-motion: no-preference) { .nw-bar-in { animation: nwgrow var(--cds-dur-slow) var(--cds-ease-out); transform-origin: bottom; transform-box: fill-box; } @keyframes nwgrow { from { transform: scaleY(0); } } }
  @media (max-width: 40rem) { .nw-table .nw-c-cat { display: none; } }
</style>

<div class="nw">
  <header class="nw-head" id="top">
    <div>
      <h1 class="nw-title">台灣即時新聞</h1>
      <p class="nw-sub">
        7 個來源共 <b data-source="summary" data-field="total" class="dash-skeleton">—</b> 則，資料抓取於
        <b data-source="summary" data-field="fetched" class="nw-fetched dash-skeleton">—</b>
        <span class="nw-ago"></span>
      </p>
    </div>
  </header>

  <div class="nw-tabs" role="tablist">
    <button class="nw-tab" role="tab" id="tab-hourly" data-tab="hourly" aria-selected="true">每小時總覽</button>
    <button class="nw-tab" role="tab" id="tab-sources" data-tab="sources" aria-selected="false">各家即時</button>
    <button class="nw-tab" role="tab" id="tab-all" data-tab="all" aria-selected="false">全部新聞（依時間）</button>
  </div>

  <section id="hourly" class="nw-panel">
    <div class="nw-card" id="hourly-chart-card" style="min-height:0">
      <div class="nw-card-h">
        <h2>過去 24 小時每小時發稿量</h2>
        <span class="nw-meta">依發布時間（台灣時間）分組，各媒體堆疊</span>
      </div>
      <div class="nw-chart dash-skeleton" id="hourly-chart" data-source="hourly"></div>
      <div class="nw-legend" id="hourly-legend" data-source="hourly"></div>
    </div>
    <div class="nw-hours" id="hour-list" data-source="news"></div>
  </section>

  <section id="sources" class="nw-panel" hidden>
    <div class="nw-grid nw-cards"></div>
  </section>

  <section id="all" class="nw-panel" hidden>
    <div class="nw-bar">
      <div class="nw-chips" style="display:flex;flex-wrap:wrap;gap:var(--cds-gap-xs)"></div>
      <input class="nw-search" type="search" placeholder="搜尋標題、分類…" aria-label="搜尋新聞">
    </div>
    <div class="nw-tablebox">
      <table class="nw-table" id="all-table" data-source="news" data-row-key="url">
        <thead><tr>
          <th data-field="published">時間</th>
          <th data-field="source">媒體</th>
          <th data-field="category" class="nw-c-cat">分類</th>
          <th data-field="title">標題</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <p class="nw-foot">點標題開啟原文。標題與連結版權屬各媒體所有；本頁只整理標題與連結。</p>
</div>

<script>
  const SOURCES = [
    { name: 'ETtoday', home: 'https://www.ettoday.net/' },
    { name: '聯合新聞', home: 'https://udn.com/news/index' },
    { name: '聯合新聞網即時', home: 'https://udn.com/news/breaknews/1/99#breaknews' },
    { name: 'LINE TODAY', home: 'https://today.line.me/tw/v3/tab' },
    { name: '三立新聞網', home: 'https://www.setn.com/' },
    { name: 'TVBS 新聞', home: 'https://news.tvbs.com.tw/' },
    { name: '中時新聞網', home: 'https://www.chinatimes.com/realtimenews/?chdtv' },
  ];
  window.NW_SOURCES = SOURCES;

  dash.calc('summary', {
    title: '新聞總數與抓取時間',
    description: '所有來源的標題數，以及這份資料抓取的時間。',
    inputs: ['news'],
    fn: (news) => ({ total: news.length, fetched: news.reduce((m, r) => (r.fetched > m ? r.fetched : m), '') }),
  });

  dash.calc('hourly', {
    title: '每小時各媒體則數',
    description: '依發布時間（台灣時間）整點分組，計算各媒體每小時的標題數；沒有發布時間的不計。',
    inputs: ['news'],
    fn: (news) => {
      const g = {};
      news.forEach((r) => {
        if (!r.published) return;
        const hour = r.published.slice(0, 13) + ':00';
        const k = hour + '|' + r.source;
        (g[k] = g[k] || { hour, source: r.source, n: 0 }).n += 1;
      });
      return Object.values(g);
    },
  });

  dash.calc('by_source', {
    title: '各媒體則數與最新時間',
    description: '每個媒體抓到幾則標題，以及其中最新一則的發布時間。',
    inputs: ['news'],
    fn: (news) => {
      const g = {};
      news.forEach((r) => {
        const x = (g[r.source] = g[r.source] || { source: r.source, n: 0, latest: '' });
        x.n += 1;
        if (r.published && r.published > x.latest) x.latest = r.published;
      });
      return Object.values(g);
    },
  });
</script>

<script>
  const fmtHM = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, '0');
    const tw = new Date(d.getTime() + (8 * 60 + d.getTimezoneOffset()) * 60000);
    return p(tw.getHours()) + ':' + p(tw.getMinutes());
  };
  const fmtFull = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    const tw = new Date(d.getTime() + (8 * 60 + d.getTimezoneOffset()) * 60000);
    const p = (n) => String(n).padStart(2, '0');
    return `${tw.getMonth() + 1}/${tw.getDate()} ${p(tw.getHours())}:${p(tw.getMinutes())}`;
  };
  const ago = (iso) => {
    if (!iso) return '';
    const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return '剛剛';
    if (m < 60) return m + ' 分鐘前';
    if (m < 60 * 24) return Math.floor(m / 60) + ' 小時前';
    return Math.floor(m / 1440) + ' 天前';
  };
  const safeHref = (u) => (/^https:\/\//.test(u || '') ? u : null);
  const link = (r) => {
    const href = safeHref(r.url);
    const el = document.createElement(href ? 'a' : 'span');
    el.className = 'nw-link';
    el.textContent = r.title;
    if (href) { el.href = href; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    return el;
  };
  const byTime = (a, b) => (b.published || '').localeCompare(a.published || '');

  // Tabs
  const tabs = [...document.querySelectorAll('.nw-tab')];
  const showTab = (id) => {
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === id)));
    document.querySelectorAll('.nw-panel').forEach((p) => (p.hidden = p.id !== id));
    dash.setLink(id);
  };
  tabs.forEach((t) => t.addEventListener('click', () => showTab(t.dataset.tab)));

  // Filters on the "all" tab
  let pick = '';
  let q = '';
  const chips = document.querySelector('.nw-chips');
  const search = document.querySelector('.nw-search');
  search.addEventListener('input', () => { q = search.value.trim().toLowerCase(); drawTable(); });
  const drawChips = () => {
    chips.replaceChildren(...[''].concat(window.NW_SOURCES.map((s) => s.name)).map((name) => {
      const b = document.createElement('button');
      b.className = 'nw-chip';
      b.textContent = name || '全部';
      b.setAttribute('aria-pressed', String(pick === name));
      b.addEventListener('click', () => { pick = name; drawChips(); drawTable(); });
      return b;
    }));
  };
  drawChips();

  const cards = document.querySelector('.nw-cards');
  const tbody = document.querySelector('#all-table tbody');

  function drawCards(rows, ok, failed) {
    cards.replaceChildren(...window.NW_SOURCES.map((s, i) => {
      const card = document.createElement('article');
      card.className = 'nw-card';
      card.id = 'src-' + i;
      const h = document.createElement('div');
      h.className = 'nw-card-h';
      const h2 = document.createElement('h2');
      const a = document.createElement('a');
      a.href = s.home; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = s.name;
      h2.append(a);
      const meta = document.createElement('span');
      meta.className = 'nw-meta';
      const n = document.createElement('span');
      n.dataset.source = 'by_source'; n.dataset.field = 'n'; n.dataset.where = 'source=' + encodeURIComponent(s.name);
      const mine = rows.filter((r) => r.source === s.name);
      const stat = (dash.data('by_source').data || []).find((x) => x.source === s.name);
      n.textContent = ok && stat ? String(stat.n) : '—';
      meta.append(n, document.createTextNode(' 則'));
      if (ok && stat && stat.latest) meta.append(document.createTextNode(' · 最新 ' + ago(stat.latest)));
      h.append(h2, meta);
      card.append(h);
      if (failed) {
        const f = document.createElement('div'); f.className = 'nw-fail'; f.textContent = 'Failed to load'; card.append(f);
        return card;
      }
      const ul = document.createElement('ul');
      ul.className = 'nw-list' + (ok ? '' : ' dash-skeleton');
      ul.dataset.source = 'news';
      const show = s.name === 'LINE TODAY' || s.name === '聯合新聞' ? mine : mine.slice().sort(byTime);
      show.slice(0, 10).forEach((r) => {
        const li = document.createElement('li');
        const t = document.createElement('span');
        t.className = 'nw-time';
        t.textContent = r.published ? fmtHM(r.published) : '';
        if (r.published && Date.now() - new Date(r.published).getTime() < 30 * 60000) t.classList.add('nw-fresh');
        const body = document.createElement('span');
        if (r.category) { const c = document.createElement('span'); c.className = 'nw-tag'; c.textContent = r.category; body.append(c); }
        body.append(link(r));
        li.append(t, body);
        ul.append(li);
      });
      if (ok && !mine.length) { const e = document.createElement('div'); e.className = 'nw-empty'; e.textContent = '這次沒有抓到這家的新聞。'; card.append(e); }
      card.append(ul);
      return card;
    }));
  }

  let allRows = [];
  function drawTable() {
    const rows = allRows
      .filter((r) => !pick || r.source === pick)
      .filter((r) => !q || (r.title + ' ' + r.category + ' ' + r.source).toLowerCase().includes(q))
      .sort(byTime);
    tbody.replaceChildren(...rows.map((r) => {
      const tr = document.createElement('tr');
      tr.dataset.key = r.url;
      const td = (cls, v) => { const c = document.createElement('td'); c.className = cls; if (v instanceof Node) c.append(v); else c.textContent = v; return c; };
      tr.append(
        td('nw-c-time', r.published ? fmtFull(r.published) : '—'),
        td('nw-c-src', r.source),
        td('nw-c-cat', r.category || ''),
        td('nw-c-title', link(r)),
      );
      return tr;
    }));
    if (!rows.length && allRows.length) {
      const tr = document.createElement('tr'); const c = document.createElement('td'); c.colSpan = 4; c.className = 'nw-empty'; c.textContent = '沒有符合的新聞。'; tr.append(c); tbody.append(tr);
    }
  }

  // Hourly overview
  const hourKey = (iso) => iso.slice(0, 13) + ':00';
  const hourLabel = (h) => h.slice(11, 13) + ':00';
  const dayLabel = (h) => `${+h.slice(5, 7)}/${+h.slice(8, 10)}`;
  const addHours = (h, k) => {
    const d = new Date(h + ':00+08:00');
    d.setTime(d.getTime() + k * 3600000);
    const tw = new Date(d.getTime() + 8 * 3600000);
    return tw.toISOString().slice(0, 13) + ':00';
  };
  const chartBox = document.getElementById('hourly-chart');
  const legend = document.getElementById('hourly-legend');
  const hourList = document.getElementById('hour-list');
  const openHours = new Set();
  let openInit = false;

  function drawHourly(ok, failed) {
    const names = window.NW_SOURCES.map((s) => s.name);
    const color = (n) => dash.colors[names.indexOf(n) % dash.colors.length];
    legend.replaceChildren(...names.map((n) => { const s = document.createElement('span'); s.style.setProperty('--sw', color(n)); s.textContent = n; return s; }));
    chartBox.replaceChildren();
    chartBox.classList.toggle('dash-skeleton', !ok && !failed);
    if (failed) { const f = document.createElement('div'); f.className = 'nw-fail'; f.style.minHeight = '260px'; f.textContent = 'Failed to load'; chartBox.append(f); }
    const hd = dash.data('hourly');
    const sm = dash.data('summary');
    if (!ok || hd.status !== 'ok' || sm.status !== 'ok' || !sm.data.fetched) { hourList.replaceChildren(); return; }
    const end = hourKey(sm.data.fetched);
    const hours = d3.range(23, -1, -1).map((k) => addHours(end, -k));
    const cell = {};
    hd.data.forEach((r) => { (cell[r.hour] = cell[r.hour] || {})[r.source] = r.n; });
    const table = hours.map((h) => Object.assign({ hour: h }, Object.fromEntries(names.map((n) => [n, (cell[h] || {})[n] || 0]))));
    const series = d3.stack().keys(names)(table);
    const W = Math.max(280, chartBox.clientWidth), H = 260;
    const yMax = d3.max(table, (r) => d3.sum(names, (n) => r[n])) || 1;
    const y = d3.scaleLinear([0, yMax], [H - 24, 8]).nice();
    const svg = d3.select(chartBox).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const yTicks = y.ticks(4);
    const tmp = svg.append('text').attr('font-size', 'var(--cds-font-size-caption)').text(d3.format(',')(d3.max(yTicks)));
    const ml = Math.ceil(tmp.node().getComputedTextLength()) + 8; tmp.remove();
    const x = d3.scaleBand(hours, [ml, W - 4]).paddingInner(0.25).paddingOuter(0.1);
    svg.append('g').selectAll('line').data(yTicks).join('line').attr('x1', ml).attr('x2', W - 4).attr('y1', (d) => y(d)).attr('y2', (d) => y(d)).attr('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(yTicks).join('text').attr('x', ml - 6).attr('y', (d) => y(d)).attr('dy', '0.32em').attr('text-anchor', 'end').attr('fill', 'var(--color-fg-muted)').attr('font-size', 'var(--cds-font-size-caption)').text(d3.format(','));
    const every = Math.ceil(24 / Math.max(1, Math.floor((W - ml) / 44)));
    svg.append('g').selectAll('text').data(hours.filter((h, i) => (hours.length - 1 - i) % every === 0)).join('text')
      .attr('x', (h) => x(h) + x.bandwidth() / 2).attr('y', H - 6).attr('text-anchor', 'middle').attr('fill', 'var(--color-fg-muted)').attr('font-size', 'var(--cds-font-size-caption)')
      .text((h) => (h.slice(11, 13) === '00' ? dayLabel(h) : hourLabel(h)));
    svg.append('line').attr('x1', ml).attr('x2', W - 4).attr('y1', y(0)).attr('y2', y(0)).attr('stroke', 'var(--cds-chart-axis)');
    svg.append('g').selectAll('g').data(series).join('g').attr('fill', (s) => color(s.key))
      .selectAll('rect').data((s) => s.map((d) => Object.assign(d, { key: s.key }))).join('rect')
      .attr('class', 'nw-bar-in')
      .attr('x', (d) => x(d.data.hour)).attr('width', x.bandwidth())
      .attr('y', (d) => y(d[1])).attr('height', (d) => Math.max(0, y(d[0]) - y(d[1])));
    const tip = document.createElement('div'); tip.className = 'nw-tip'; tip.hidden = true; chartBox.append(tip);
    const hl = svg.append('rect').attr('fill', 'none').attr('stroke', 'var(--color-fg)').attr('stroke-width', 1).attr('rx', 2).attr('visibility', 'hidden');
    svg.append('g').selectAll('rect').data(table).join('rect')
      .attr('x', (r) => x(r.hour) - (x.step() - x.bandwidth()) / 2).attr('width', x.step()).attr('y', 0).attr('height', H - 24).attr('fill', 'transparent')
      .style('cursor', 'pointer')
      .on('mousemove', (ev, r) => {
        const total = d3.sum(names, (n) => r[n]);
        hl.attr('visibility', 'visible').attr('x', x(r.hour) - 1).attr('width', x.bandwidth() + 2).attr('y', y(total) - 1).attr('height', Math.max(0, y(0) - y(total)) + 1);
        tip.replaceChildren();
        const h = document.createElement('div'); h.className = 'h'; h.textContent = `${dayLabel(r.hour)} ${hourLabel(r.hour)}–${hourLabel(addHours(r.hour, 1))} · 共 ${total} 則`; tip.append(h);
        names.filter((n) => r[n]).forEach((n) => { const l = document.createElement('div'); const i = document.createElement('i'); i.style.background = color(n); const b = document.createElement('b'); b.textContent = r[n]; l.append(i, document.createTextNode(n), b); tip.append(l); });
        tip.hidden = false;
        const [mx] = d3.pointer(ev, chartBox);
        const tw = tip.offsetWidth;
        tip.style.left = Math.min(Math.max(0, mx + 12), chartBox.clientWidth - tw) + 'px';
        tip.style.top = '8px';
      })
      .on('mouseleave', () => { tip.hidden = true; hl.attr('visibility', 'hidden'); })
      .on('click', (ev, r) => { openHours.add(r.hour); drawHourList(); const el = document.getElementById('h-' + r.hour.slice(0, 13)); if (el) el.scrollIntoView({ block: 'start' }); });
    drawHourList(hours);
  }

  let lastHours = [];
  function drawHourList(hours) {
    if (hours) lastHours = hours;
    const names = window.NW_SOURCES.map((s) => s.name);
    const groups = d3.group(allRows.filter((r) => r.published), (r) => hourKey(r.published));
    const list = lastHours.slice().reverse().filter((h) => groups.has(h));
    if (!openInit && list.length) { openInit = true; list.slice(0, 2).forEach((h) => openHours.add(h)); }
    hourList.replaceChildren(...list.map((h) => {
      const rows = groups.get(h).slice().sort(byTime);
      const det = document.createElement('details');
      det.className = 'nw-hour'; det.id = 'h-' + h.slice(0, 13);
      det.open = openHours.has(h);
      det.addEventListener('toggle', () => { if (det.open) openHours.add(h); else openHours.delete(h); });
      const sum = document.createElement('summary');
      const t = document.createElement('span'); t.className = 't'; t.textContent = `${dayLabel(h)} ${hourLabel(h)}`;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = rows.length + ' 則';
      const bd = document.createElement('span'); bd.className = 'bd';
      bd.textContent = names.map((nm) => [nm, rows.filter((r) => r.source === nm).length]).filter((x) => x[1]).map((x) => `${x[0]} ${x[1]}`).join(' · ');
      sum.append(t, n, bd);
      det.append(sum);
      const body = document.createElement('div'); body.className = 'nw-hour-body';
      names.forEach((nm) => {
        const mine = rows.filter((r) => r.source === nm);
        if (!mine.length) return;
        const col = document.createElement('div');
        const h3 = document.createElement('h3'); h3.textContent = `${nm}（${mine.length}）`;
        const ul = document.createElement('ul'); ul.className = 'nw-list';
        mine.forEach((r) => {
          const li = document.createElement('li');
          const tm = document.createElement('span'); tm.className = 'nw-time'; tm.textContent = fmtHM(r.published);
          const b = document.createElement('span');
          if (r.category) { const c = document.createElement('span'); c.className = 'nw-tag'; c.textContent = r.category; b.append(c); }
          b.append(link(r));
          li.append(tm, b); ul.append(li);
        });
        col.append(h3, ul); body.append(col);
      });
      det.append(body);
      return det;
    }));
  }

  let shownOnce = false;
  dash.onData(() => {
    const d = dash.data('news');
    const ok = d.status === 'ok';
    const failed = d.status === 'error';
    allRows = ok ? d.data : [];
    const sm = dash.data('summary');
    const s = sm.status === 'ok' ? sm.data : null;
    document.querySelectorAll('[data-source="summary"]').forEach((el) => {
      el.classList.toggle('dash-skeleton', !s && !failed);
      el.textContent = s ? (el.dataset.field === 'total' ? d3.format(',')(s.total) : fmtFull(s.fetched)) : '—';
    });
    document.querySelector('.nw-ago').textContent = s && s.fetched ? '（' + ago(s.fetched) + '）' : '';
    drawHourly(ok, failed);
    drawCards(allRows, ok, failed);
    drawTable();
    if (!shownOnce && ok) {
      shownOnce = true;
      const id = location.hash.slice(1);
      if (id === 'all' || id === 'sources' || id === 'hourly') showTab(id);
    }
  });
</script>
