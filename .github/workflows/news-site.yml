name: News site

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news-dashboard/**"
      - ".github/workflows/news-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch previous data from the live site
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/news.json" -o prev.json || echo "[]" > prev.json
      - name: Scrape news
        run: |
          mkdir -p _site
          python3 news-dashboard/scrape_news.py _site/news.json prev.json
      - name: Build page
        run: python3 news-dashboard/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
